id: case1-asis-latest-italy
title: "Case 1: ASIS latest (Italy)"
status: implemented
notebook:
  source_repo: "https://github.com/un-fao/FERSPAS_demo"
  source_file: "Case1-ASIS-latest-Italy.ipynb"
stac:
  api_root: "https://data.apps.fao.org/geospatial/search/stac"
  collection: "fao-gismgr:ASIS:raster:mapsets:ASI-D"
  collection_notebook_value: "ASI-D"
  collection_note: "The notebook's pystac-client code uses the short id 'ASI-D'. As with Case 2, a raw HTTP POST to /search with that short id returns zero features with no error. The full collection id (this field) was found via GET /collections."
  bbox:
    - 6
    - 36
    - 20
    - 48
  datetime_window: "a rolling 90-day window ending 2999-12-31 (not a fixed date range) -- ASIS publishes a new dekad every ~10 days, so this task always searches for whatever is currently the latest one, matching the reference notebook's own 'latest N days' approach"
  limit: 100
selection:
  method: "among items returned by the search, take the maximum start_datetime (the latest published dekad), then select the one item at that datetime whose id ends in '-GS1-LC-C' (growing season 1, cropland)"
  notebook_method_note: "The reference notebook extracts the 'time phase' by string-indexing 10 characters before the substring 'GS' in the item id, then string-sorts to find the latest. This task reproduces the same outcome using the item's own start_datetime and a suffix regex instead, which is more robust to id-format changes."
  gs_lc_meaning: "GS1/GS2 = growing season 1/2 (cube:dimensions.SEASON); LC-C/LC-G = cropland/grassland land cover type (cube:dimensions.LCT). This task follows the notebook and uses GS1/LC-C."
aoi:
  name: "Italy"
  iso3: "ITA"
  boundary_source: "Natural Earth 10m admin-0 countries (Public Domain), feature ISO_A3=ITA, retrieved 2026-09-20"
  boundary_asset: "docs/Case1-ASIS-latest-Italy/aoi-ITA.geojson"
asset:
  preferred_keys:
    - data
raster:
  crs: "EPSG:4326"
  dtype: "Float32 (declared 'other' in STAC; observed as float32 via gdalinfo)"
  bands: 1
  nodata_source: 255
  nodata_note: "255 is ASI-D's declared NoData, but the collection's own classification:classes lists 255 as a real class ('no_data' or 'water/background' depending on which metadata field is read -- classification:classes and supplemental_information disagree, see docs-internal/findings.md 2026-09-19). Values 251-254 are additional sentinel/flag codes (off-season, insufficient data, no seasonality, no cropland/grassland). Only 0-100 is a real Agricultural Stress Index percentage."
  unit: "%"
  spatial_resolution_m: 993.9240180161709
  value_granularity_note: "Real (0-100) values are quantized to 0.5-point steps in practice (confirmed 2026-09-19 by sampling an actual dekad over Hokkaido), likely reflecting a moving-window percentage calculation rather than a per-pixel continuous measurement. See docs-internal/findings.md."
access:
  cors_status: "anonymous reads denied at source"
  cors_note: "The source GCS bucket (fao-gismgr-asis-data) rejects anonymous reads outright (redirects to Google login), unlike Case 2's DRAINED-AREA-CROP bucket which allows anonymous reads but lacks CORS headers. Confirmed 2026-09-19 (docs-internal/findings.md, docs-internal/decisions.md)."
  auth_requirement: "This task's checkout script requires Google Application Default Credentials (ADC) for the account that has read access to fao-gismgr-asis-data. It cannot be run anonymously. This is a Tier B source in the FAO / local-foundation / User three-tier model (docs-internal/decisions.md)."
  local_foundation_note: "Unlike Case 2, this Case cannot be reproduced by an arbitrary local foundation without first obtaining read access to the source bucket from FAO or an authorized party."
meaning_note: "ASI-D is a satellite-derived (NDVI/LST-based Kogan-method) agricultural drought stress indicator, not a statistical redistribution like Case 2's DRAINED-AREA-CROP. See docs-internal/findings.md for the full derivation chain (VCI/TCI -> VHI -> MVHI -> ASI) and docs-internal/decisions.md for research on who actually uses this class of indicator operationally."
provenance_doc: "docs-internal/findings.md"
decisions_doc: "docs-internal/decisions.md"
derived_provenance: "docs/Case1-ASIS-latest-Italy/derived/provenance-ITA.json"
checkout_script: "scripts/checkout-Case1-ASIS-latest-Italy.py"
